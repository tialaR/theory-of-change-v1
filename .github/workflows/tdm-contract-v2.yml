name: TDM Contract V2

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  contract:
    name: tdm-contract-v2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Full design system gate
        env:
          TDM_BASE_REF: origin/dev
        run: npm run check:tdm:v2:all

      - name: Production build
        run: npm run build
